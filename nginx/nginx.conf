worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Edge Rate Limiting Zones (Token Bucket per IP)
    limit_req_zone $binary_remote_addr zone=api_gateway_zone:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_zone:10m;

    # Logging format with correlation ID
    log_format gateway_format '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" req_id="$http_x_request_id" '
                             'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log gateway_format;
    error_log /var/log/nginx/error.log warn;

    # 3. Upstream Load Balancer (Least Connections)
    upstream backend_cluster {
        least_conn;
        server backend:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_cluster {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Max client body size for member photos & biometric templates
        client_max_body_size 10M;

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API Gateway Request Correlation ID Injection
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        # 5. API Gateway Routing -> Backend Cluster
        location /api/ {
            limit_req zone=api_gateway_zone burst=30 nodelay;
            limit_conn addr_conn_zone 20;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # HTTP Connection & Proxy Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            # Resilient Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Stricter Rate-Limiting for Authentication Gateway
        location /api/auth/login {
            limit_req zone=auth_limit_zone burst=5 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # 4. Reverse Proxy Frontend SPA Routing
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

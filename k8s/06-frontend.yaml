apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsefit-frontend
  namespace: gym-prod
  labels:
    app: pulsefit-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pulsefit-frontend
  template:
    metadata:
      labels:
        app: pulsefit-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vinofitness/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pulsefit-frontend-service
  namespace: gym-prod
  labels:
    app: pulsefit-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: pulsefit-frontend

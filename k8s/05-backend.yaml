apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsefit-backend
  namespace: gym-prod
  labels:
    app: pulsefit-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pulsefit-backend
  template:
    metadata:
      labels:
        app: pulsefit-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/vinofitness/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: pulsefit-config
            - secretRef:
                name: pulsefit-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: pulsefit-backend-service
  namespace: gym-prod
  labels:
    app: pulsefit-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: pulsefit-backend

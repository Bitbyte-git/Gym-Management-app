services:
  # 2. Redis Caching & Distributed Rate-Limiting Store
  redis:
    image: redis:7-alpine
    container_name: pulsefit-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Application Backend (Node.js API Server)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: pulsefit-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://user:pass@cluster.mongodb.net/pulsefit}
      - JWT_SECRET=${JWT_SECRET:-vino_fitness_production_secret_key_2026}
      - JWT_EXPIRE=30d
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gym-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 4. Web Client Frontend (Vite React SPA via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: pulsefit-frontend
    restart: unless-stopped
    networks:
      - gym-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 4. Reverse Proxy & 5. API Gateway (Edge Nginx)
  gateway:
    image: nginx:1.25-alpine
    container_name: pulsefit-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gym-network

volumes:
  redis_data:
    driver: local

networks:
  gym-network:
    driver: bridge
